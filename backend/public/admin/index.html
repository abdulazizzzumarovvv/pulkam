<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulKam — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, 'Segoe UI', sans-serif; background: #0d1018; color: #e8e8ee; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .gold { color: #F5D061; }
  .card { background: #161a26; border: 1px solid #232838; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat { text-align: center; }
  .stat .n { font-size: 28px; font-weight: 700; color: #F5D061; }
  .stat .l { font-size: 13px; color: #8a90a6; margin-top: 4px; }
  input { background: #0d1018; border: 1px solid #2a3040; color: #fff; padding: 10px 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; font-size: 15px; }
  button { background: linear-gradient(100deg, #F5D061, #D4AF37); color: #2a230a; border: none; padding: 11px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; }
  button.mini { padding: 6px 12px; font-size: 13px; }
  button.red { background: #E74C3C; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #232838; }
  th { color: #8a90a6; font-weight: 600; }
  .badge { padding: 2px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; }
  .pro { background: rgba(245,208,97,.15); color: #F5D061; }
  .free { background: #232838; color: #8a90a6; }
  .hidden { display: none; }
  .row { display: flex; gap: 10px; align-items: center; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { background: #161a26; color: #8a90a6; }
  .tabs button.active { background: #F5D061; color: #2a230a; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="gold">PulKam</span> — Admin panel</h1>

  <!-- Login -->
  <div id="login" class="card" style="max-width: 360px; margin-top: 40px;">
    <h3 style="margin-bottom:14px;">Kirish</h3>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Parol">
    <button onclick="login()">Kirish</button>
    <p id="loginErr" style="color:#E74C3C; margin-top:10px; font-size:14px;"></p>
  </div>

  <!-- Panel -->
  <div id="panel" class="hidden">
    <div class="card stats" id="stats"></div>
    <div class="tabs">
      <button id="tabUsers" class="active" onclick="showTab('users')">Foydalanuvchilar</button>
      <button id="tabPayments" onclick="showTab('payments')">To'lovlar</button>
    </div>
    <div class="card" id="usersCard"><table id="usersTable"></table></div>
    <div class="card hidden" id="paymentsCard"><table id="paymentsTable"></table></div>
  </div>
</div>

<script>
const API = location.origin;
let token = localStorage.getItem('pk_admin_token');

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers||{}) },
  });
  if (r.status === 401) { logout(); throw new Error('unauth'); }
  return r.json();
}

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const r = await fetch(API + '/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await r.json();
  if (data.token) { token = data.token; localStorage.setItem('pk_admin_token', token); boot(); }
  else document.getElementById('loginErr').textContent = data.error || 'Xato';
}

function logout() {
  localStorage.removeItem('pk_admin_token'); token = null;
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

function fmt(n) { return Number(n).toLocaleString('ru-RU'); }
function date(s) { return s ? new Date(s).toLocaleDateString('ru-RU') : '—'; }

async function boot() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  const s = await api('/admin/stats');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${fmt(s.revenue)}</div><div class="l">Jami daromad (so'm)</div></div>
    <div class="stat"><div class="n">${s.activePro}</div><div class="l">Faol PRO</div></div>
    <div class="stat"><div class="n">${s.paidCount}</div><div class="l">To'lovlar soni</div></div>`;
  loadUsers(); loadPayments();
}

async function loadUsers() {
  const { users } = await api('/admin/users');
  let h = `<tr><th>Ism</th><th>Email</th><th>Holat</th><th>Plan</th><th>Muddat</th><th></th></tr>`;
  for (const u of users) {
    h += `<tr>
      <td>${u.name || '—'}</td>
      <td>${u.email || '—'}</td>
      <td><span class="badge ${u.is_pro ? 'pro':'free'}">${u.is_pro ? 'PRO':'Bepul'}</span></td>
      <td>${u.plan || '—'}</td>
      <td>${u.expires_at ? date(u.expires_at) : (u.is_pro ? 'umrbod':'—')}</td>
      <td class="row">
        <button class="mini" onclick="grant(${u.id})">PRO ber</button>
        ${u.is_pro ? `<button class="mini red" onclick="revoke(${u.id})">Bekor</button>`:''}
      </td></tr>`;
  }
  document.getElementById('usersTable').innerHTML = h;
}

async function loadPayments() {
  const { payments } = await api('/admin/payments');
  let h = `<tr><th>Sana</th><th>Ism</th><th>Plan</th><th>Summa</th><th>Holat</th></tr>`;
  for (const p of payments) {
    h += `<tr>
      <td>${date(p.created_at)}</td>
      <td>${p.name || p.email || '—'}</td>
      <td>${p.plan}</td>
      <td>${fmt(p.amount)}</td>
      <td><span class="badge ${p.status==='paid'?'pro':'free'}">${p.status}</span></td>
    </tr>`;
  }
  document.getElementById('paymentsTable').innerHTML = h;
}

async function grant(userId) {
  const plan = prompt('Plan: oylik / yillik / umrbod', 'umrbod');
  if (!plan) return;
  await api('/admin/grant', { method: 'POST', body: JSON.stringify({ userId, plan }) });
  loadUsers(); boot();
}
async function revoke(userId) {
  if (!confirm('PRO ni bekor qilamizmi?')) return;
  await api('/admin/revoke', { method: 'POST', body: JSON.stringify({ userId }) });
  loadUsers(); boot();
}

function showTab(t) {
  document.getElementById('tabUsers').classList.toggle('active', t==='users');
  document.getElementById('tabPayments').classList.toggle('active', t==='payments');
  document.getElementById('usersCard').classList.toggle('hidden', t!=='users');
  document.getElementById('paymentsCard').classList.toggle('hidden', t!=='payments');
}

if (token) boot();
</script>
</body>
</html>
